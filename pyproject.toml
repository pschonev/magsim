[project]
name = "magsim"
version = "2.0.0"
description = "A simulator for Magical Athlete"
authors = [{ name = "Philipp Schoneville", email = "philipp@schoneville.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "rich>=13.7.1",
    "cappa>=0.31.0",
    "duckdb-engine>=0.17.0",
    "msgspec>=0.18.6",
    "tqdm>=4.67.1",
    "polars>=1.24.0",
]
[project.urls]
Repository = "https://github.com/pschonev/magsim"
Changelog = "https://github.com/pschonev/magsim/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "poethepoet>=0.40.0",
    "commitizen>=4.11.0",
    "pyrefly>=1.5.0",
]

[project.scripts]
magsim = "magsim.__main__:main"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "ANN",
    "PLR",
    "E501",
    "G004",
    "TRY003",
    "EM101",
    "S311",
    "C901",
    "RET505",
    "CPY001"
]

# Ruff
[tool.ruff]
exclude = ["tests"]
target-version = "py312"

# Pyrefly
[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src", "tests"]
project-excludes = ["tests/reference"]
python-version = "3.12"

[tool.pyrefly.errors]
implicit-bool = "ignore"

# Pytest
[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

# Commitizen
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true


# Poe
[tool.poe]
envfile = ".env"

[tool.poe.tasks]
clean = "rm -rf dist"
bump-files = "cz bump --yes --files-only"
release-prep = "python scripts/release_prep.py"

# One command for a complete new batch: the main batch, the Mush-only games in results_mush/ and Mush's merged power pairs
batch-main = "magsim batch -f configs/twisty_oversampled.toml"
batch-mush = "magsim batch -f --seed-offset 10000000 --results-dir results_mush configs/mush_only.toml"
mush-pairs = "python scripts/prepare_mush_pairs.py"
ai-compare = "python scripts/ai_compare.py"
batch = { sequence = ["batch-main", "batch-mush", "mush-pairs", "ai-compare"] }
# Only the Mush games (the main batch already exists): `uv run poe mush`, then `uv run poe web-build`
mush = { sequence = ["batch-mush", "mush-pairs"] }

web-assets = "python scripts/prepare_web_assets.py"
web-dev = { sequence = ["web-assets", { cmd = "npm run dev", cwd = "web" }] }
web-build = { sequence = ["web-assets", { cmd = "npm run build", cwd = "web" }] }

git-add = "git add pyproject.toml uv.lock CHANGELOG.md docs/results"
git-finalize = "python scripts/release_git.py"

release-build = "uv build"
release-publish = "uv publish"

release-push = "git push"
release-push-tags = "git push --tags"

release-github = { shell = 'ver=$(cz version --project) && cz changelog "$ver" --dry-run > release_notes.md && gh release create "$ver" --notes-file release_notes.md' }

release = { sequence = [
    "clean",
    "bump-files",
    "release-prep",
    "git-add",
    "git-finalize",
    "release-build",
    "release-publish",
    "release-push",
    "release-push-tags",
    "release-github",
] }


[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"
